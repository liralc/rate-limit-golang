services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    environment:
      REDIS_TEST_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - test
